[profile.default]
src = "contracts"
test = "tests-solidity"
out = "out"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./fixtures" }, { access = "read", path = "./out-upstream" }]

[profile.default.fuzz]
runs = 256
seed = "0x4e5143"

[profile.core]
test = "tests-core"
