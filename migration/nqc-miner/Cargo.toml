[package]
name = "nqc-miner"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Isolated, read-only discovery and evidence engine for NQC Miner"
license = "UNLICENSED"

[workspace]

[dependencies]
alloy-primitives = { version = "=1.4.1", features = ["serde"] }
alloy-sol-types = "=1.4.1"
clap = { version = "=4.5.50", features = ["derive"] }
rand = "=0.8.6"
rand_chacha = "=0.3.1"
rand_distr = "=0.4.3"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
revm = { version = "=19.5.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"

[build-dependencies]
sha2 = "=0.10.9"

[dev-dependencies]
proptest = "=1.8.0"
tempfile = "=3.23.0"

[profile.release]
overflow-checks = true
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
