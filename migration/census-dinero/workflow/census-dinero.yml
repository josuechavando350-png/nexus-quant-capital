name: Census del dinero

# Solo lectura de cadenas públicas. Nada se firma ni se envía.
# Se dispara al empujar un cambio de run.json en la rama del census.
on:
  push:
    branches: [feat/census-dinero-20261024]
    paths:
      - migration/census-dinero/run.json
      - .github/workflows/census-dinero.yml

permissions:
  contents: write

concurrency:
  group: census-dinero
  cancel-in-progress: true

jobs:
  collect:
    if: github.repository_id == 1411047452
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        chain: [ethereum, base, arbitrum]
    defaults:
      run:
        working-directory: migration/census-dinero
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NQC_CENSUS_RPC_ETHEREUM: ${{ secrets.NQC_CENSUS_RPC_ETHEREUM }}
      NQC_CENSUS_RPC_BASE: ${{ secrets.NQC_CENSUS_RPC_BASE }}
      NQC_CENSUS_RPC_ARBITRUM: ${{ secrets.NQC_CENSUS_RPC_ARBITRUM }}
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Leer configuración de la corrida
        id: cfg
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          c = json.load(open("run.json"))
          print("run=" + ("true" if os.environ["CHAIN"] in c["chains"] else "false"))
          print(f"days={c['days']}")
          print(f"protocols={c.get('protocols', 'aave,morpho')}")
          print(f"budget={c.get('time_budget_min', 300)}")
          PY
        env:
          CHAIN: ${{ matrix.chain }}
      - name: Pruebas offline y aislamiento
        if: steps.cfg.outputs.run == 'true'
        run: |
          python3 -m unittest discover -s tests
          python3 check_isolation.py
      - name: Recolectar ${{ matrix.chain }}
        if: steps.cfg.outputs.run == 'true'
        run: |
          mkdir -p "out/${{ matrix.chain }}"
          set -o pipefail
          python3 -m census_dinero collect --chain "${{ matrix.chain }}" \
            --days "${{ steps.cfg.outputs.days }}" \
            --protocols "${{ steps.cfg.outputs.protocols }}" \
            --time-budget-min "${{ steps.cfg.outputs.budget }}" \
            --out "out/${{ matrix.chain }}" 2>&1 | tee "out/${{ matrix.chain }}/log.txt"
      - name: Publicar resultados de la cadena
        if: always() && steps.cfg.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "out/${{ matrix.chain }}"
          echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}" > "out/${{ matrix.chain }}/origen.txt"
          python3 ci/push_results.py --src "out/${{ matrix.chain }}" \
            --dest "corridas/${GITHUB_RUN_ID}/${{ matrix.chain }}" \
            --message "census ${{ matrix.chain }} run ${GITHUB_RUN_ID}"

  report:
    needs: collect
    if: always() && github.repository_id == 1411047452
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: migration/census-dinero
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Juntar cadenas y escribir el reporte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 --branch census-dinero/resultados \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/res
          files=$(ls /tmp/res/corridas/${GITHUB_RUN_ID}/*/liquidaciones.jsonl 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "Ninguna cadena produjo resultados en esta corrida." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 -m census_dinero analyze --out /tmp/reporte $files > /dev/null
          cat /tmp/reporte/RESUMEN.md >> "$GITHUB_STEP_SUMMARY"
          cp run.json /tmp/reporte/run.json
          python3 ci/push_results.py --src /tmp/reporte --dest "corridas/${GITHUB_RUN_ID}/reporte" \
            --message "census reporte run ${GITHUB_RUN_ID}"
          python3 ci/push_results.py --src /tmp/reporte --dest "ultimo" \
            --message "census último reporte (run ${GITHUB_RUN_ID})"
