[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nqc-defense-local"
version = "0.22.0"
description = "Local artifact admission and authenticated audit archives for NQC"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
signing = ["cryptography==50.0.2"]

[project.scripts]
nqc-defense = "nqc_defense.__main__:main"

[tool.setuptools.packages.find]
include = ["nqc_defense*"]
