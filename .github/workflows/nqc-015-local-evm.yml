name: NQC 015 - eight local EVM cases
run-name: NQC015 local EVM - ${{ github.sha }}
on:
  push:
    branches: [research/nqc-015-local-evm-20261017]
    paths: [.github/workflows/nqc-015-local-evm.yml, migration/experiments/nqc-015-local-evm-20261017/**]
permissions: {}
jobs:
  local-evm:
    if: github.repository == 'josuechavando350-png/nexus-quant-capital' && github.event.repository.private == false && github.run_attempt == 1 && github.event.head_commit.message == 'NQC015_APPROVED_LOCAL_EVM_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Fetch exact NQC producer and run local-only tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = josuechavando350-png/nexus-quant-capital
          test "$GITHUB_REF" = refs/heads/research/nqc-015-local-evm-20261017
          git init -q "$RUNNER_TEMP/nqc015-producer"
          git -C "$RUNNER_TEMP/nqc015-producer" remote add origin https://github.com/josuechavando350-png/nexus-quant-capital.git
          git -C "$RUNNER_TEMP/nqc015-producer" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/nqc015-producer" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/nqc015-producer" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m venv "$RUNNER_TEMP/nqc015-venv"
          "$RUNNER_TEMP/nqc015-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: pycryptodome==3.23.0
          "$RUNNER_TEMP/nqc015-venv/bin/python" "$RUNNER_TEMP/nqc015-producer/migration/experiments/nqc-015-local-evm-20261017/ci_evm.py"
