name: NQC 018 bounded funding-policy experiment
on:
  push:
    branches: [research/nqc-018-funding-boundary-20261018]
    paths: [.github/workflows/nqc-018-funding-boundary.yml]
permissions:
  contents: read
jobs:
  local-funding:
    if: >-
      github.repository == 'josuechavando350-png/nexus-quant-capital' &&
      github.event.repository.private == false &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'NQC018_APPROVED_LOCAL_FUNDING_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Exact NQC producer; local unsigned child only
        shell: bash
        run: |
          set -euo pipefail
          export NQC_PRODUCER_ROOT="$RUNNER_TEMP/nqc018-producer"
          git init -q "$NQC_PRODUCER_ROOT"
          git -C "$NQC_PRODUCER_ROOT" remote add origin https://github.com/josuechavando350-png/nexus-quant-capital.git
          git -C "$NQC_PRODUCER_ROOT" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$NQC_PRODUCER_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$NQC_PRODUCER_ROOT" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PYCODE'
          import base64,gzip,hashlib,json,os,subprocess,sys
          from pathlib import Path
          packed=base64.b64decode('',validate=True)
          assert hashlib.sha256(packed).hexdigest()=='a1cf6d6b07978a221305e41560fc242773f2632e4eb8e7b814dd05dc956de720'
          files=json.loads(gzip.decompress(packed))
          assert set(files)=={'ci_funding.py','funding_matrix.py','test_funding_matrix.py'}
          target=Path(os.environ['RUNNER_TEMP'])/'nqc018-source';target.mkdir(exist_ok=False)
          for name,content in files.items():
              assert '/' not in name and len(content)<50000
              (target/name).write_text(content)
          subprocess.run([sys.executable,str(target/'ci_funding.py')],check=True)
          PYCODE
