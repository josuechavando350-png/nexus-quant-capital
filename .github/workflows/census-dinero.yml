name: Census del dinero

# Solo lectura de cadenas públicas. Nada se firma ni se envía.
# Se dispara al empujar un cambio de run.json en la rama del census.
on:
  push:
    branches: [feat/census-dinero-20261024]
    paths:
      - migration/census-dinero/run.json
      - .github/workflows/census-dinero.yml

permissions:
  contents: write

concurrency:
  group: census-dinero
  cancel-in-progress: true

jobs:
  plan:
    if: github.repository_id == 1411047452
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      modo: ${{ steps.plan.outputs.modo }}
      fuente: ${{ steps.plan.outputs.fuente }}
      matrix: ${{ steps.plan.outputs.matrix }}
      protocols: ${{ steps.plan.outputs.protocols }}
      budget: ${{ steps.plan.outputs.budget }}
      vivo: ${{ steps.plan.outputs.vivo }}
      replay: ${{ steps.plan.outputs.replay }}
    defaults:
      run:
        working-directory: migration/census-dinero
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pruebas offline y aislamiento
        run: |
          python3 -m unittest discover -s tests
          python3 check_isolation.py
      - name: Partir la ventana en tramos
        id: plan
        run: |
          python3 -m census_dinero plan --run-json run.json | tee -a "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("run.json"))
          print(f"protocols={c.get('protocols', 'aave,morpho')}")
          print(f"budget={c.get('time_budget_min', 300)}")
          PY

  collect:
    needs: plan
    if: github.repository_id == 1411047452 && needs.plan.outputs.modo == 'recolectar'
    name: collect (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: migration/census-dinero
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NQC_CENSUS_RPC_ETHEREUM: ${{ secrets.NQC_CENSUS_RPC_ETHEREUM }}
      NQC_CENSUS_RPC_BASE: ${{ secrets.NQC_CENSUS_RPC_BASE }}
      NQC_CENSUS_RPC_ARBITRUM: ${{ secrets.NQC_CENSUS_RPC_ARBITRUM }}
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recolectar ${{ matrix.label }}
        run: |
          mkdir -p "out/${{ matrix.label }}"
          set -o pipefail
          python3 -m census_dinero collect --chain "${{ matrix.chain }}" \
            --start-ts "${{ matrix.start_ts }}" --end-ts "${{ matrix.end_ts }}" --tramo "${{ matrix.label }}" \
            --protocols "${{ needs.plan.outputs.protocols }}" \
            --time-budget-min "${{ needs.plan.outputs.budget }}" \
            --out "out/${{ matrix.label }}" 2>&1 | tee -i "out/${{ matrix.label }}/log.txt"
      - name: Publicar resultados del tramo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "out/${{ matrix.label }}"
          echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}" > "out/${{ matrix.label }}/origen.txt"
          python3 ci/push_results.py --src "out/${{ matrix.label }}" \
            --dest "corridas/${GITHUB_RUN_ID}/${{ matrix.chain }}/${{ matrix.label }}" \
            --message "census ${{ matrix.label }} run ${GITHUB_RUN_ID}"

  report:
    needs: [plan, collect]
    if: always() && github.repository_id == 1411047452 && needs.plan.result == 'success' && !startsWith(needs.plan.outputs.modo, 'shadow')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: migration/census-dinero
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Juntar tramos, escribir el reporte y verificar contra el explorador
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ needs.plan.outputs.modo }}
          FUENTE: ${{ needs.plan.outputs.fuente }}
        run: |
          git clone -q --depth 1 --branch census-dinero/resultados \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/res
          src="${FUENTE:-$GITHUB_RUN_ID}"
          files=$(python3 -m census_dinero archivos --res /tmp/res --run "$src" --run-json run.json)
          if [ -z "$files" ]; then
            echo "Ningún tramo produjo resultados en la corrida ${src}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p /tmp/reporte
          if [ "$MODO" != "verificar" ]; then
            python3 -m census_dinero analyze --run-json run.json --out /tmp/reporte $files > /dev/null
            cat /tmp/reporte/RESUMEN.md >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 -m census_dinero verificar --out /tmp/reporte $files > /dev/null \
            || echo "La verificación contra el explorador falló; el reporte sigue." >> "$GITHUB_STEP_SUMMARY"
          [ -f /tmp/reporte/VERIFICACION.md ] && cat /tmp/reporte/VERIFICACION.md >> "$GITHUB_STEP_SUMMARY"
          cp run.json /tmp/reporte/run.json
          if [ "$MODO" = "recolectar" ]; then
            python3 ci/push_results.py --src /tmp/reporte --dest "corridas/${GITHUB_RUN_ID}/reporte" \
              --message "census reporte run ${GITHUB_RUN_ID}"
            python3 ci/push_results.py --src /tmp/reporte --dest "ultimo" \
              --message "census último reporte (run ${GITHUB_RUN_ID})"
          elif [ "$MODO" = "reporte" ]; then
            python3 ci/push_results.py --src /tmp/reporte --dest "corridas/${src}/reporte-${GITHUB_RUN_ID}" \
              --message "census reporte de run ${src} rehecho (run ${GITHUB_RUN_ID})"
            python3 ci/push_results.py --src /tmp/reporte --dest "ultimo" \
              --message "census último reporte (run ${src}, rehecho en run ${GITHUB_RUN_ID})"
          else
            python3 ci/push_results.py --src /tmp/reporte --dest "corridas/${src}/verificacion-${GITHUB_RUN_ID}" \
              --message "census verificación de run ${src} (run ${GITHUB_RUN_ID})"
          fi

  # --- Shadow de Base/Morpho (modo "shadow" en run.json) --------------------------------
  # Solo lectura. Nada se firma ni se envía; el proceso que lee la cadena no recibe el token.
  shadow:
    needs: plan
    if: github.repository_id == 1411047452 && needs.plan.outputs.modo == 'shadow' && needs.plan.outputs.vivo == 'true'
    name: shadow en vivo (Base/Morpho)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    defaults:
      run:
        working-directory: migration/census-dinero
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NQC_CENSUS_RPC_BASE: ${{ secrets.NQC_CENSUS_RPC_BASE }}
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Cargar el libro guardado de una corrida anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cache out/shadow-vivo
          if git clone -q --depth 1 --branch census-dinero/resultados \
               "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/res 2>/dev/null \
             && [ -f /tmp/res/shadow/cache/libro.json ]; then
            cp /tmp/res/shadow/cache/libro.json cache/libro.json
            echo "Libro guardado cargado."
          else
            echo "Sin libro guardado: se arma desde cero."
          fi
          rm -rf /tmp/res
      - name: Shadow en vivo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Cada 10 minutos se sube lo que haya (solo el publicador tiene el token).
          ( while sleep 600; do
              python3 ci/push_results.py --src out/shadow-vivo --dest "corridas/${GITHUB_RUN_ID}/shadow-vivo" \
                --message "shadow vivo run ${GITHUB_RUN_ID} (parcial)" || true
            done ) &
          pub=$!
          set +e
          env -u GH_TOKEN python3 -m census_dinero shadow --run-json run.json --out out/shadow-vivo \
            --cache cache/libro.json 2>&1 | tee -i out/shadow-vivo/log.txt
          code=${PIPESTATUS[0]}
          kill "$pub" 2>/dev/null
          exit "$code"
      - name: Publicar el Shadow en vivo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/shadow-vivo /tmp/cache-out
          echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}" > out/shadow-vivo/origen.txt
          [ -f out/shadow-vivo/libro.json ] && mv out/shadow-vivo/libro.json /tmp/cache-out/libro.json
          rm -f out/shadow-vivo/*.tmp
          python3 ci/push_results.py --src out/shadow-vivo --dest "corridas/${GITHUB_RUN_ID}/shadow-vivo" \
            --message "shadow vivo run ${GITHUB_RUN_ID}"
          if [ -f /tmp/cache-out/libro.json ]; then
            python3 ci/push_results.py --src /tmp/cache-out --dest shadow/cache \
              --message "shadow libro guardado (run ${GITHUB_RUN_ID})"
          fi

  replay:
    needs: plan
    if: github.repository_id == 1411047452 && needs.plan.outputs.modo == 'shadow' && needs.plan.outputs.replay == 'true'
    name: shadow replay (Base/Morpho)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: migration/census-dinero
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NQC_CENSUS_RPC_BASE: ${{ secrets.NQC_CENSUS_RPC_BASE }}
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Replay histórico
        run: |
          mkdir -p out/shadow-replay
          set -o pipefail
          python3 -m census_dinero replay --run-json run.json --out out/shadow-replay 2>&1 | tee -i out/shadow-replay/log.txt
      - name: Publicar el replay
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/shadow-replay
          echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}" > out/shadow-replay/origen.txt
          python3 ci/push_results.py --src out/shadow-replay --dest "corridas/${GITHUB_RUN_ID}/shadow-replay" \
            --message "shadow replay run ${GITHUB_RUN_ID}"

  shadow_report:
    needs: [plan, shadow, replay]
    if: always() && github.repository_id == 1411047452 && needs.plan.result == 'success' && (needs.plan.outputs.modo == 'shadow' || needs.plan.outputs.modo == 'shadow_reporte')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: migration/census-dinero
    steps:
      - name: Checkout sin credenciales persistidas
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Juntar el vivo y el replay y escribir el reporte
        env:
          GH_TOKEN: ${{ github.token }}
          FUENTE: ${{ needs.plan.outputs.fuente }}
        run: |
          git clone -q --depth 1 --branch census-dinero/resultados \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/res
          src="${FUENTE:-$GITHUB_RUN_ID}"
          args=()
          if [ -d "/tmp/res/corridas/${src}/shadow-vivo" ]; then args+=(--live "/tmp/res/corridas/${src}/shadow-vivo"); fi
          if [ -d "/tmp/res/corridas/${src}/shadow-replay" ]; then args+=(--replay "/tmp/res/corridas/${src}/shadow-replay"); fi
          if [ "${#args[@]}" -eq 0 ]; then
            echo "Ni el vivo ni el replay produjeron resultados en la corrida ${src}." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          mkdir -p /tmp/reporte
          python3 -m census_dinero shadow-report "${args[@]}" --run-json run.json --out /tmp/reporte > /dev/null
          cat /tmp/reporte/RESUMEN_SHADOW.md >> "$GITHUB_STEP_SUMMARY"
          cp run.json /tmp/reporte/run.json
          python3 ci/push_results.py --src /tmp/reporte --dest "corridas/${src}/shadow-reporte-${GITHUB_RUN_ID}" \
            --message "shadow reporte de run ${src} (run ${GITHUB_RUN_ID})"
          python3 ci/push_results.py --src /tmp/reporte --dest "shadow/ultimo" \
            --message "shadow último reporte (run ${src}, hecho en run ${GITHUB_RUN_ID})"
