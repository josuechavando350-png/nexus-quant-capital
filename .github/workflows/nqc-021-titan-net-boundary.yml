name: NQC 021 fixed requests and net settlement boundary
on:
  push:
    branches: [research/nqc-021-titan-net-boundary-20261018]
    paths: [.github/workflows/nqc-021-titan-net-boundary.yml]
permissions:
  contents: read
jobs:
  local-funding:
    if: >-
      github.repository == 'josuechavando350-png/nexus-quant-capital' &&
      github.event.repository.private == false &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'NQC021_APPROVED_NET_PLAIN_ONCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Readable isolated sources; fixed unsigned candidate; no commercial admission
        shell: bash
        run: |
          set -euo pipefail
          export NQC_PRODUCER_ROOT="$RUNNER_TEMP/nqc021-producer"
          git init -q "$NQC_PRODUCER_ROOT"
          git -C "$NQC_PRODUCER_ROOT" remote add origin https://github.com/josuechavando350-png/nexus-quant-capital.git
          git -C "$NQC_PRODUCER_ROOT" fetch --depth=1 origin "$GITHUB_SHA"
          git -C "$NQC_PRODUCER_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$NQC_PRODUCER_ROOT" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PYCODE'
          import ast,base64,gzip,hashlib,json,os,subprocess,sys
          from pathlib import Path
          root=Path(os.environ['NQC_PRODUCER_ROOT'])
          old=(root/'.github/workflows/nqc-018-funding-boundary.yml').read_text()
          encoded=next(l.strip().split('packed=',1)[1] for l in old.splitlines() if 'packed=base64.b64decode(' in l)
          call=ast.parse(encoded,mode='eval').body
          packed=base64.b64decode(ast.literal_eval(call.args[0]),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='a1cf6d6b07978a221305e41560fc242773f2632e4eb8e7b814dd05dc956de720'
          files=json.loads(gzip.decompress(packed))
          assert set(files)=={'ci_funding.py','funding_matrix.py','test_funding_matrix.py'}
          sub='migration/experiments/nqc-021-titan-net-boundary-20261018'
          locks={'funding_matrix.py':'e64e1e43f9e1ac60c959ac47344069e249262b89d5c6e7e3f2c38ce8397700c9','test_funding_matrix.py':'b0fb741370b7f8ec94848d08a29745e79d9c4889e7ff33f899479eafa69600e3'}
          for name,h in locks.items():
              raw=(root/sub/name).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==h
              files[name]=raw.decode()
          s=files['ci_funding.py']
          s=s.replace("PARENT='6da36867faad9f915355188dbefd890a7498d93f'","PARENT='71d276e2c7f67b3f564d086463efca09cfbbf940'")
          s=s.replace('NQC018','NQC021').replace('nqc018','nqc021').replace('nqc-018-funding-boundary','nqc-021-titan-net-boundary')
          s=s.replace('NQC021_APPROVED_LOCAL_FUNDING_ONCE','NQC021_APPROVED_NET_PLAIN_ONCE')
          assert 'expected={WF}' in s
          s=s.replace('expected={WF}',"expected={WF, SUB+'/funding_matrix.py', SUB+'/test_funding_matrix.py'}")
          s=s.replace('TWELVE_LOCAL_CASE_ASSERTIONS_PASS_NOT_COMMERCIAL','LOCAL_NET_CASH_TESTED_RESIDUAL_AND_NO_RECOURSE_UNRESOLVED')
          files['ci_funding.py']=s
          target=Path(os.environ['RUNNER_TEMP'])/'nqc021-source';target.mkdir(exist_ok=False)
          for name,content in files.items():
              assert '/' not in name and len(content)<50000
              ast.parse(content)
              (target/name).write_text(content)
          subprocess.run([sys.executable,str(target/'ci_funding.py')],check=True)
          PYCODE
