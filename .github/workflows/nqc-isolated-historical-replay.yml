name: NQC isolated historical EVM replay
'on':
  push:
    branches: [research/isolated-historical-replay-20261020]
    paths: [.github/workflows/nqc-isolated-historical-replay.yml]
permissions:
  contents: read
concurrency:
  group: nqc-isolated-historical-replay-20261020
  cancel-in-progress: false
jobs:
  replay:
    if: github.repository == 'josuechavando350-png/nexus-quant-capital' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Verify pinned review, unchanged original source and baseline isolation
        shell: bash
        env:
          BASE: 16e352225ba8a6a931834c4edf3d86d9a2924b7d
          PREVIOUS: 71fbfa2c30eb56b8c006dc33f294f284212cce01
          REVIEW: 315e4019eb9fe1980f0ea21e925e69cd79dbd8d1
          SOURCE: df29f5539910caae90604c0f6c39292998074f0c
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'josuechavando350-png/nexus-quant-capital'
          test "$GITHUB_REF" = 'refs/heads/research/isolated-historical-replay-20261020'
          test "$GITHUB_RUN_ATTEMPT" = 1
          ROOT="$RUNNER_TEMP/nqc-replay-producer"
          git init "$ROOT"
          git -C "$ROOT" remote add origin https://github.com/josuechavando350-png/nexus-quant-capital.git
          git -C "$ROOT" fetch --no-tags --depth=20 origin "$GITHUB_SHA"
          git -C "$ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$ROOT" rev-parse HEAD^)" = "$SOURCE"
          test "$(git -C "$ROOT" rev-parse HEAD^^)" = "$REVIEW"
          test "$(git -C "$ROOT" rev-parse HEAD~3)" = "$PREVIOUS"
          test "$(git -C "$ROOT" ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git -C "$ROOT" worktree add --detach "$RUNNER_TEMP/nqc-replay-base" "$BASE"
          python3 "$RUNNER_TEMP/nqc-replay-base/migration/verify_isolation.py" --root "$RUNNER_TEMP/nqc-replay-base"
          (cd "$RUNNER_TEMP/nqc-replay-base" && python3 -m unittest discover -v -s migration -p test_isolation.py)
          export ROOT
          python3 - <<'PY'
          import os,subprocess,json
          root=os.environ['ROOT'];prefix='migration/experiments/isolated-historical-replay-20261020/'
          expected={'M\t.github/workflows/nqc-isolated-historical-replay.yml','A\t'+prefix+'ARCHIVE_CAPABILITY_REVIEW.md','A\t'+prefix+'archive_probe_replay.py'}
          changes=subprocess.check_output(['git','-C',root,'diff','--name-status','--no-renames',os.environ['PREVIOUS'],'HEAD'],text=True).splitlines()
          assert set(changes)==expected,changes
          r=subprocess.run(['python3',root+'/migration/verify_isolation.py','--root',root],text=True,capture_output=True)
          print('ISOLATION_REVIEW '+json.dumps({'baseline_verified':True,'exact_three_path_delta':True,'new_producer_verifier_rc':r.returncode,'new_producer_verifier_output':r.stdout+r.stderr,'producer_sha':os.environ['GITHUB_SHA']}))
          assert r.returncode==1 and (r.stdout+r.stderr).strip()=='ISOLATION_FAILED: forbidden active/client tree'
          PY
      - name: Archive capability gate then unchanged baseline-first EVM proof
        shell: bash
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,hashlib,json,os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP']);source=tmp/'nqc-replay-producer/migration/experiments/isolated-historical-replay-20261020'
          raw=(source/'source_bundle.json.gz').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='712bc3461b04bb6411947ae0bed68704de2ff825e29ba05ee31d47f7c8918514'
          manifest=json.loads((source/'MANIFEST.json').read_text());files=json.loads(gzip.decompress(raw))
          assert set(files)==set(manifest['files']) and len(files)==6
          runtime=tmp/'nqc-historical-runtime'
          for name,text in files.items():
              data=text.encode();record=manifest['files'][name]
              assert len(data)==record['bytes'] and hashlib.sha256(data).hexdigest()==record['sha256'],name
              p=runtime/name;assert p.resolve().is_relative_to(runtime.resolve())
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          driver=(source/'archive_probe_replay.py').read_bytes()
          assert hashlib.sha256(driver).hexdigest()=='b7758aecc3381984d2f59154aebdf0fa834e3cdd18b328cbb01e7ef34a1a7068'
          (runtime/'archive_probe_replay.py').write_bytes(driver)
          print('VERIFIED: all six original files unchanged; new transport-only wrapper; no paid or debug RPC')
          PY
          cd "$RUNNER_TEMP/nqc-historical-runtime"
          python3 -m unittest -v test_guard
          python3 archive_probe_replay.py --offline-test
          python3 archive_probe_replay.py
